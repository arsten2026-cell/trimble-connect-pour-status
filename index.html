<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монолитен бетон</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --tag:#C8102E; --ok:#2f7d32; --bad:#b3261e; --panel:#fff; --mix:#b26a00; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink); font:13px/1.4 Ubuntu, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:14px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .top h1 { margin-right:auto; }
  .status { font-size:12px; color:var(--muted); margin-bottom:8px; min-height:1.4em; }
  .status.bad { color:var(--bad); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; align-items:center; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.small { padding:2px 7px; font-size:12px; }
  button:disabled { opacity:.45; cursor:default; }
  select, input[type=date], input[type=text], input[type=search] { font:inherit; font-size:12px; padding:3px 5px; border:1px solid var(--line); border-radius:0; background:#fff; }
  .box { background:var(--panel); border:1px solid var(--line); padding:8px; }
  .warn { background:#fff4e5; border:1px solid #f0c48a; padding:8px; font-size:12px; margin:6px 0; }
  .warn ol { margin:4px 0 4px 18px; padding:0; }
  .sel { font-size:12px; }
  .sel b { font-size:13px; }
  .steps { display:grid; gap:6px; }
  .step { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); padding:7px 8px; }
  .step .hd { display:flex; align-items:baseline; gap:6px; }
  .step .nm { font-weight:600; }
  .step .st { margin-left:auto; font-size:11px; font-weight:600; white-space:nowrap; }
  .st.all { color:var(--ok); } .st.mixed { color:var(--mix); } .st.none { color:var(--muted); }
  .step .dates { font-size:11px; color:var(--muted); }
  .step .row { display:flex; gap:4px; margin-top:5px; align-items:center; }
  .step .row input[type=date] { width:122px; flex:none; }
  .step .row input[type=text] { flex:1; min-width:0; width:0; }
  .step .row button { white-space:nowrap; }
  .step .row:last-child { flex-wrap:wrap; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; margin:4px 0; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
  label.chk { display:inline-flex; align-items:center; gap:4px; font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { padding:4px 3px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:10.5px; font-weight:600; color:var(--muted); }
  td.n, th.n { text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:11.5px; }
  td.n.full { color:var(--ok); font-weight:600; } td.n.part { color:var(--mix); font-weight:600; } td.n.zero { color:#b8b4ab; }
  .name { font-weight:600; white-space:nowrap; }
  .sub { font-size:11px; color:var(--muted); }
  .hrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .hrow h2 { margin-bottom:6px; }
  .empty { color:var(--muted); font-size:12px; padding:8px 0; }
  .step .hint { font-size:11px; color:var(--muted); min-height:0; }
  .step .hint:empty { display:none; }
  .confirm { border:1px solid var(--accent); background:#fff; padding:6px; margin-top:4px; font-size:12px; }
  .confirm .bar { margin:4px 0 0; }
  /* View box (week 3, A7): a big switch for "Оцвети по статус" at the top, the legend, then the smaller options */
  .viewbox { border-left:4px solid var(--line); }
  .viewbox.on { border-left-color:var(--accent); }
  label.switch { display:flex; align-items:center; gap:8px; cursor:pointer; position:relative; font-size:12px; min-height:28px; }
  label.switch input[type=checkbox] { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  label.switch .sl { flex:none; width:34px; height:18px; background:#b8b4ab; position:relative; transition:background .15s; }
  label.switch .sl::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; background:#fff; transition:left .15s; }
  label.switch input:checked + .sl { background:var(--ink); }
  label.switch input:checked + .sl::after { left:18px; }
  label.switch input:focus-visible + .sl { outline:2px solid var(--accent); outline-offset:2px; }
  label.switch.main { font-size:14px; font-weight:600; min-height:36px; }
  label.switch.main .sl { width:48px; height:26px; }
  label.switch.main .sl::after { width:20px; height:20px; top:3px; left:3px; }
  label.switch.main input:checked + .sl { background:var(--accent); }
  label.switch.main input:checked + .sl::after { left:25px; }
  .viewbox .legend { margin:6px 0; }
  .viewbox:not(.on) .legend { opacity:.5; }
  .legend .sw { width:12px; height:12px; }
  .legend .cnt { font-weight:600; font-variant-numeric:tabular-nums; }
  .vopts { display:flex; flex-wrap:wrap; gap:4px 16px; border-top:1px solid var(--line); padding-top:6px; }
  /* "Излят" without accepted rebar (A3): warning before the write, second tap confirms */
  .accwarn { margin-top:5px; padding:5px 7px; font-size:12px; background:#fff4e5; border:1px solid #f0c48a; }
  .accwarn.armed { border-color:var(--bad); background:#fdecea; }
  .accwarn.armed div { margin-top:3px; font-weight:600; }
  button.armed { background:var(--bad); border-color:var(--bad); }
  /* sweep 18.11.2026: part of a pour selected ("1 от 15 обекта на TAKT 1 · Избери целия такт"); nothing selected = one
     line + a jump to the pours list instead of four disabled step cards */
  .partpour { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin-top:5px; padding:5px 7px; font-size:12px; background:#fff4e5; border:1px solid #f0c48a; }
  .pickfirst { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:8px; background:var(--panel); border:1px solid var(--line); font-size:13px; }
  /* search above the pours table (A5) */
  .search input[type=search] { flex:1 1 160px; min-width:0; }
  /* result of a write, at the bottom near the finger (A2) */
  body { padding-bottom:calc(56px + env(safe-area-inset-bottom, 0px)); }
  /* always in the DOM (screen readers), visually hidden when idle; taps pass through, and it stays left of the
     right-aligned "Отмени" so it never blocks the undo row */
  .toast { position:fixed; left:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); z-index:50; max-width:min(70%, 420px);
    padding:8px 10px; font-size:13px; color:#fff; pointer-events:none; }
  .toast:not(.show) { width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
  .toast.ok { background:var(--ok); }
  .toast.bad { background:var(--bad); }
  /* touch screens (A1): ~40 px targets, 16 px inputs (no iOS zoom), destructive buttons away from the main action */
  @media (pointer: coarse) {
    button, button.small, select, input[type=date], input[type=text], input[type=search] { min-height:40px; }
    button.small { padding:6px 12px; font-size:14px; }
    select, input[type=date], input[type=text], input[type=search] { font-size:16px; padding:6px 8px; }
    input[type=checkbox] { width:22px; height:22px; }
    label.chk { min-height:40px; font-size:14px; }
    label.switch { min-height:40px; font-size:14px; }
    label.switch.main { font-size:16px; min-height:44px; }
    .bar { gap:8px; }
    .step .row { gap:8px; flex-wrap:wrap; }
    .step .row input[type=date] { width:auto; flex:1 1 150px; }
    .step .row input[type=text] { flex:1 1 160px; width:auto; }
    .step .row button.undo { margin-left:auto; }
    .confirm .bar button.cancel { margin-left:auto; }
  }
</style>
</head>
<body>
<div class="top"><h1 id="title">Монолитен бетон</h1>
  <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
<button type="button" class="small secondary" data-arsten-diag style="float:right;margin-left:6px">Копирай диагностика</button>
<div id="status" class="status">Trimble Connect…</div>

<div id="setupBox" class="warn" hidden></div>

<div id="mainBox" hidden>
  <div id="legacyBox"></div>
  <h2 id="hSel">Selection</h2>
  <div class="box sel">
    <div id="selText"></div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="chkFollow"> <span id="lblFollow">Follow model selection</span></label>
      <button id="btnFromViewer" class="small secondary">Use viewer selection</button>
      <button id="btnSelClear" class="small secondary">Clear</button>
    </div>
  </div>

  <!-- sweep 18.11.2026: the steps (the most common site task) come right after the selection, the acceptance box under
       them ("Излят" depends on it), then photos, then the view settings - no scrolling past two tall boxes on a phone -->
  <h2 id="hSteps">Steps</h2>
  <div id="steps" class="steps"></div>
  <div id="accBox"></div>

  <h2 id="hPhotos">Снимки</h2>
  <div id="photosBox"></div>

  <h2 id="hView">View</h2>
  <div id="viewBox" class="box viewbox">
    <label class="switch main"><input type="checkbox" role="switch" id="chkColour"><span class="sl" aria-hidden="true"></span><span id="lblColour">Colour by status</span></label>
    <div id="colourHint" class="sub"></div>
    <div id="legend" class="legend"></div>
    <div class="vopts">
      <label class="switch"><input type="checkbox" role="switch" id="chkSeeThrough"><span class="sl" aria-hidden="true"></span><span id="lblSeeThrough">Not started see-through</span></label>
      <label class="switch"><input type="checkbox" role="switch" id="chkHideRebar"><span class="sl" aria-hidden="true"></span><span id="lblHideRebar">Hide rebar</span></label>
    </div>
  </div>

  <div class="hrow"><h2 id="hSummary">Pours</h2><button id="btnCsv" class="small secondary">Export Excel</button></div>
  <div class="bar search"><input type="search" id="pourSearch" autocomplete="off" enterkeyhint="search"><button id="btnPickMatches" class="small secondary" disabled>Select in the model</button></div>
  <table>
    <thead id="sumHead"></thead>
    <tbody id="sumRows"></tbody>
  </table>

  <div id="splitBox" hidden>
    <h2 id="hSplits">Разделени тактове</h2>
    <div id="splitText" class="warn"></div>
    <table><tbody id="splitRows"></tbody></table>
  </div>

  <div id="mergeBox" hidden>
    <h2 id="hMerges">Обединени отново</h2>
    <table><tbody id="mergeRows"></tbody></table>
  </div>

  <div id="protectBox" hidden>
    <h2 id="hProtect">Права в библиотеката</h2>
    <div class="box"><div id="protectText" class="sub"></div></div>
    <h2 id="hRoles">Роли в проекта</h2>
    <div class="box sub" id="rolesList"></div>
  </div>

  <div id="orphanBox" hidden>
    <h2 id="hOrphans">Status without object</h2>
    <div id="orphanText" class="warn"></div>
    <table><tbody id="orphanRows"></tbody></table>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="common.js?v=a04c428e31"></script>
<script src="status.js?v=5dfad10961"></script>
<script src="arsten-links.js?v=7bf607a606"></script>
<script src="psetapi.js?v=527efaf855"></script>
<script src="arsten-photos.js?v=58db357146"></script>
<script src="arsten-acceptance.js?v=f8e113bc4d"></script>
<script src="arsten-backup.js?v=6c54dfe763"></script>
<script src="app.js?v=b4079cfccf"></script>
</body>
</html>
